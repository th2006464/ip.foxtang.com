argin-bottom:4px}.value{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{border:0;background:linear-gradient(145deg,#176fd9,#0d5fc5);color:#fff}.summary .icon{background:#ffffff24}.summary .sub{color:#cfe2ff}.mode{font-size:22px;font-weight:750;margin:5px 0 8px}.desc{font-size:13px;line-height:1.65;color:#e4efff;margin:0}.signals{display:grid;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid #ffffff2e;font-size:12px}.signals div:before{content:"✓";margin-right:7px}.protocols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.protocol{padding:13px;border-radius:15px;background:#f7f9fc;font-size:12px;font-weight:700}.proto-ip{margin:8px 0 0;color:var(--muted);font:11px/1.45 ui-monospace,monospace;overflow-wrap:anywhere}.dot{float:right;width:8px;height:8px;border-radius:50%;background:#c5ccd7}.dot.on{background:var(--green)}.retry{width:100%;border:0;border-radius:16px;padding:14px;background:#172033;color:#fff;font-weight:700;font-size:14px;cursor:pointer}.retry:disabled{opacity:.55;cursor:wait}.foot{text-align:center;color:var(--muted);font-size:11px;line-height:1.65;margin:18px 10px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:#172033ed;color:#fff;border-radius:99px;padding:9px 15px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';const TIMEOUT=5000,$=s=>document.querySelector(s),results={};
const rootEl=document.documentElement,themeMeta=document.querySelector('meta[name="theme-color"]');
$('#theme-toggle').addEventListener('click',()=>{const next=rootEl.dataset.theme==='dark'?'light':'dark';rootEl.dataset.theme=next;localStorage.setItem('ip-theme',next);themeMeta&&themeMeta.setAttribute('content',next==='dark'?'#0b1730':'#f4f7fb');dispatchEvent(new CustomEvent('ip-themechange'))});
const META={current:['☁️','当前出口','Cloudflare 边缘网络'],cn:['🇨🇳','国内线路','中国大陆 IP 服务'],global:['🌍','国际线路','独立国际 IP 服务'],special:['🇺🇸','Google 可达性','实际请求 google.com'],googleRoute:['🇺🇸','Google线路','sspanel.net 线路参考']};
$('#cards').innerHTML=Object.entries(META).map(([k,m])=>`<article class="card" data-card="${k}"><div class="head"><div class="icon">${m[0]}</div><div class="title"><h2>${m[1]}</h2><p class="sub">${m[2]}</p></div><span class="status loading">检测中</span></div><button class="ip" disabled>正在获取…</button><div class="hint"></div><div class="details"><div class="detail"><span class="label">国家 / 地区</span><span class="value" data-f="location">—</span></div><div class="detail"><span class="label">运营商 / 节点</span><span class="value" data-f="isp">—</span></div><div class="detail"><span class="label">ASN / 协议</span><span class="value" data-f="asn">—</span></div><div class="detail"><span class="label">HTTP 延迟</span><span class="value" data-f="latency">—</span></div></div></article>`).join('')+`<article class="card summary"><div class="head"><div class="icon">⌁</div><div class="title"><h2>网络模式</h2><p class="sub">仅根据出口 IP 差异推测</p></div></div><div class="mode" id="mode">等待检测结果</div><p class="desc" id="desc">三个线路完成后展示初步判断。</p><div class="signals" id="signals"></div></article><article class="card"><div class="head"><div class="icon">↔</div><div class="title"><h2>IP 协议</h2><p class="sub">当前浏览器连通性</p></div></div><div class="protocols"><div class="protocol">IPv4 <span class="dot" id="v4dot"></span><p class="proto-ip" id="v4">检测中…</p></div><div class="protocol">IPv6 <span class="dot" id="v6dot"></span><p class="proto-ip" id="v6">检测中…</p></div></div></article><button class="retry" id="retry">重新检测</button>`;
function trace(t){const d={};t.trim().split('\n').forEach(x=>{let i=x.indexOf('=');if(i>0)d[x.slice(0,i)]=x.slice(i+1)});return{ip:d.ip,countryCode:d.loc,colo:d.colo,http:d.http}}
function ipip(d){const a=d.data?.location||[];return{ip:d.data?.ip,country:a[0],region:a[1],city:a[2],isp:a[4]}}
function ipipText(t){return{ip:t.match(/([0-9a-f]*:[0-9a-f:.]+|(?:\d{1,3}\.){3}\d{1,3})/i)?.[1],location:t.split(/来自于[:：]/)[1]?.trim()}}
function ipinfo(d){let o=d.org||'';return{ip:d.ip,countryCode:d.country,region:d.region,city:d.city,asn:o.match(/^AS\d+/)?.[0],isp:o.replace(/^AS\d+\s*/,'')}}
function ipwho(d){if(d.success===false)throw Error(d.message);return{ip:d.ip,country:d.country,countryCode:d.country_code,region:d.region,city:d.city,asn:d.connection?.asn?`AS${d.connection.asn}`:'',isp:d.connection?.isp||d.connection?.org}}
const PROBES={cn:[['https://myip.ipip.net/json','json',ipip,'IPIP JSON'],['https://myip.ipip.net','text',ipipText,'IPIP 文本'],['https://ipinfo.io/json','json',ipinfo,'IPInfo']],global:[['https://api64.ipify.org?format=json','json',d=>({ip:d.ip}),'ipify'],['https://ident.me/.json','json',d=>({ip:d.address}),'ident.me'],['https://icanhazip.com','text',t=>({ip:t.trim()}),'icanhazip']],googleRoute:[['https://sspanel.net/cdn-cgi/trace','text',trace,'sspanel.net Trace']]};
document.querySelector('.summary .sub').textContent='出口比较与 Google 实测';
async function get(url,type='json',timeout=TIMEOUT){let c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout),start=performance.now();try{let u=url+(url.includes('?')?'&':'?')+'_='+Date.now()+Math.random(),r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return{data:type==='text'?await r.text():await r.json(),latency:Math.round(performance.now()-start)}}finally{clearTimeout(timer)}}
async function list(k){let last;for(const [u,t,p,n] of PROBES[k])try{let x=await get(u,t),r={...p(x.data),latency:x.latency,source:n};if(!r.ip)throw Error('无有效 IP');console.log(`[${k.toUpperCase()} Probe]`,r);return r}catch(e){last=e;console.warn(`[${k.toUpperCase()} Probe] ${n}`,e)}throw last}
async function enrich(r){if(r.country||r.countryCode||r.location)return r;try{let x=await get('https://ipwho.is/'+encodeURIComponent(r.ip));return{...ipwho(x.data),...r}}catch{return r}}
function country(c){try{return new Intl.DisplayNames(['zh-CN'],{type:'region'}).of(c)}catch{return c||''}}function loc(r){return r.location||[country(r.countryCode)||r.country,r.region,r.city].filter((x,i,a)=>x&&a.indexOf(x)===i).join(' · ')||'未知'}
function loading(k){let c=$(`[data-card="${k}"]`),ip=c.querySelector('.ip');c.querySelector('.status').className='status loading';c.querySelector('.status').textContent='检测中';ip.classList.remove('reachable');ip.textContent='正在获取…';ip.disabled=true;c.querySelector('.hint').textContent='';c.querySelectorAll('[data-f]').forEach(x=>x.textContent='—')}
function paint(k,r){let c=$(`[data-card="${k}"]`),s=c.querySelector('.status'),b=c.querySelector('.ip');s.className='status ok';s.textContent='已完成';b.textContent=r.ip;b.dataset.ip=r.ip;b.disabled=false;c.querySelector('.hint').textContent=`点击复制 · ${r.source}`;let put=(f,v)=>c.querySelector(`[data-f="${f}"]`).textContent=v||'—';put('location',loc(r));put('isp',r.isp||r.colo);put('asn',r.asn||r.http?.toUpperCase());put('latency',r.latency+' ms')}
function fail(k,e){let c=$(`[data-card="${k}"]`),s=c.querySelector('.status');s.className='status error';s.textContent=e?.name==='AbortError'?'超时':'失败';c.querySelector('.ip').textContent='探针不可用';c.querySelector('.ip').disabled=true;c.querySelector('.hint').textContent='其他检测不受影响'}
async function googleProbe(){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),TIMEOUT),start=performance.now();try{await fetch('https://www.google.com/generate_204?_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:controller.signal});return{reachable:true,latency:Math.round(performance.now()-start),source:'Google generate_204'}}finally{clearTimeout(timer)}}
function paintGoogle(r){let c=$('[data-card="special"]'),s=c.querySelector('.status'),b=c.querySelector('.ip'),put=(f,v)=>c.querySelector(`[data-f="${f}"]`).textContent=v||'—';s.className='status ok';s.textContent='可访问';b.classList.add('reachable');b.innerHTML='<span class="reach-icon">✓</span><span>Google 可访问</span>';b.disabled=true;c.querySelector('.hint').textContent='已实际连接 www.google.com';put('location','www.google.com');put('isp','连接成功');put('asn','不提供出口 IP');put('latency',r.latency+' ms')}
function summary(){let a=results.cn?.ip,b=results.global?.ip,g=results.special?.reachable,title='检测数据不足',desc='国内或国际线路探针不可用，暂不比较出口。',sig=[],fam=x=>x?.includes(':')?'IPv6':'IPv4';if(a&&b){if(fam(a)!==fam(b)){title='检测数据不足';desc='国内与国际探针返回了不同 IP 协议，无法可靠比较出口。';sig=['请参考两个线路的原始结果']}else if(a===b){title='国内 / 国际同出口';desc='国内与国际探针当前看到相同公网出口。';sig=['相同出口不等同于未开启代理']}else{title='疑似规则分流';desc='国内与国际探针当前看到不同公网出口。';sig=['国内线路与国际线路出口不同']}}sig.push(g?'Google 实际连接成功':'Google 实际连接失败或超时');$('#mode').textContent=title;$('#desc').textContent=desc;$('#signals').innerHTML=sig.map(x=>`<div>${x}</div>`).join('')}
async function proto(urls,id){for(const [url,key,type='json'] of urls)try{let x=await get(url,type),ip=type==='text'?x.data.trim():x.data[key];if(!ip)throw 0;$(`#${id}`).textContent=ip;$(`#${id}dot`).className='dot on';return}catch{}let fallback=Object.values(results).find(r=>r.ip&&(id==='v6')===r.ip.includes(':'))?.ip;if(fallback){$(`#${id}`).textContent=fallback;$(`#${id}dot`).className='dot on'}else{$(`#${id}`).textContent='未检测到';$(`#${id}dot`).className='dot'}}
async function detect(){Object.keys(META).forEach(loading);Object.keys(results).forEach(k=>delete results[k]);$('#retry').disabled=true;$('#retry').textContent='检测中…';$('#mode').textContent='正在分析…';$('#desc').textContent='等待国内、国际与 Google 检测结果。';$('#signals').innerHTML='';let jobs={current:get('https://www.cloudflare.com/cdn-cgi/trace','text').then(x=>({...trace(x.data),latency:x.latency,source:'Cloudflare Trace'})),cn:list('cn').then(enrich),global:list('global').then(enrich),special:googleProbe(),googleRoute:list('googleRoute').then(enrich)};await Promise.all(Object.entries(jobs).map(async([k,p])=>{try{results[k]=await p;k==='special'?paintGoogle(results[k]):paint(k,results[k])}catch(e){fail(k,e)}}));summary();await Promise.allSettled([proto([['https://api4.ipify.org?format=json','ip'],['https://ipv4.icanhazip.com','ip','text']], 'v4'),proto([['https://api6.ipify.org?format=json','ip'],['https://v6.ident.me/.json','address']], 'v6')]);$('#retry').disabled=false;$('#retry').textContent='重新检测'}
function initThreads(){const canvas=document.createElement('canvas');canvas.className='threads-bg';canvas.setAttribute('aria-hidden','true');document.body.prepend(canvas);const ctx=canvas.getContext('2d',{alpha:true}),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let w=0,h=0,dpr=1,lineRgb='31,126,235',mouse={x:.5,y:.5},target={x:.5,y:.5},raf=0;function refreshLine(){const v=getComputedStyle(document.documentElement).getPropertyValue('--line-rgb').trim();if(v)lineRgb=v.split(',').map(x=>x.trim()).join(',')}function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}function draw(ms=0){ctx.clearRect(0,0,w,h);mouse.x+=(target.x-mouse.x)*.035;mouse.y+=(target.y-mouse.y)*.035;const t=ms*.00016,amp=Math.min(h*.13,135)*(1+(mouse.y-.5)*.18),base=h*.28;ctx.lineCap='round';for(let i=0;i<30;i++){const p=i/29;ctx.beginPath();for(let x=-20;x<=w+20;x+=12){const nx=x/Math.max(w,1),fade=Math.pow(Math.max(0,nx),.72),wave=Math.sin(nx*7.2+t*6+p*4.6)+.46*Math.sin(nx*15.5-t*3+p*8.1),y=base+p*h*.42+wave*amp*fade*.24+(mouse.x-.5)*32*fade;if(x===-20)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=`rgba(${lineRgb},${.015+(1-p)*.055})`;ctx.lineWidth=.7+(1-p)*.75;ctx.stroke()}if(!reduce&&!document.hidden)raf=requestAnimationFrame(draw)}addEventListener('resize',()=>{resize();draw()},{passive:true});addEventListener('pointermove',e=>{target.x=e.clientX/Math.max(innerWidth,1);target.y=1-e.clientY/Math.max(innerHeight,1)},{passive:true});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden&&!reduce)raf=requestAnimationFrame(draw)});refreshLine();addEventListener('ip-themechange',()=>{refreshLine();draw()});resize();draw()}initThreads();
document.addEventListener('click',async e=>{let b=e.target.closest('.ip');if(b&&!b.disabled){try{await navigator.clipboard.writeText(b.dataset.ip);let t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}catch{}}});$('#retry').onclick=detect;detect();
