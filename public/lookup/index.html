<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><meta name="description" content="查询 IP 或域名的 DNS 与网络归属地信息"><title>IP / 域名查询</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/lookup/lookup.css"><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#738095;--line:#e2e8f0;--blue:#1473e6;--green:#149d69;--red:#d94343}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#dbeaff,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.app{width:min(100% - 32px,980px);margin:auto;padding:34px 0 calc(36px + env(safe-area-inset-bottom))}.back{display:inline-flex;gap:6px;align-items:center;color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:23px}.hero{text-align:center;margin:0 auto 22px}.logo{display:grid;place-items:center;width:62px;height:62px;margin:auto;border-radius:20px;background:linear-gradient(145deg,#3188f1,#1166d1);box-shadow:0 12px 25px #1473e63d;font-size:29px}.hero h1{margin:13px 0 5px;font-size:26px}.hero p{margin:0;color:var(--muted);font-size:13px}.search{display:flex;gap:9px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px #1f395a12}.search input{min-width:0;flex:1;border:0;outline:0;padding:8px 9px;font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}button{border:0;border-radius:12px;padding:0 19px;background:var(--blue);color:#fff;font-weight:750;font-size:14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.tip{margin:10px 4px 22px;color:var(--muted);font-size:12px;text-align:center}.result{display:grid;gap:13px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 12px 34px #1f395a12}.card h2{font-size:16px;margin:0}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.badge{padding:4px 9px;border-radius:999px;background:#edf5ff;color:var(--blue);font-size:11px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}.field{min-width:0;padding:10px 0;border-top:1px solid var(--line)}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.value{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:650;overflow-wrap:anywhere}.copy{padding:2px 7px;background:#edf5ff;color:var(--blue);font-size:11px;flex:none}.records{display:grid;gap:0}.record{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.record b{color:var(--muted);font-size:12px}.empty,.notice{color:var(--muted);font-size:13px;line-height:1.6}.error{border-color:#f0caca;background:#fff8f8;color:#a62d2d}.loading{color:var(--muted);text-align:center;padding:22px}.foot{text-align:center;margin:21px 0 0;color:var(--muted);font-size:11px;line-height:1.65}@media(max-width:640px){.app{width:min(100% - 24px,980px);padding-top:21px}.search{padding:8px}.search input{font-size:13px}.search button{padding:0 13px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:15px}.record{grid-template-columns:52px 1fr}}@media(max-width:380px){.grid{grid-template-columns:1fr}.search{align-items:stretch;flex-direction:column}.search button{min-height:42px}}
</style></head><body><main class="app"><header class="hero"><a class="home-logo" href="/" aria-label="返回网络出口检测"><div class="logo">⌕</div></a><h1>IP / 域名查询</h1><p>查询 IP 归属地，或解析域名的 DNS 与网络情报</p></header><form class="search" id="search"><input id="q" name="q" autocomplete="off" spellcheck="false" placeholder="输入 IP 地址、域名或 URL" aria-label="IP 地址或域名"><button id="submit" type="submit">查询</button></form><p class="tip">支持 IPv4、IPv6、域名及带协议的 URL</p><section class="result" id="result" aria-live="polite"><p class="loading">输入内容后开始查询</p></section><footer class="foot">归属地数据为网络数据库估算结果，不代表真实物理地址。私有、保留和文档地址不会发送到第三方服务。</footer></main><script>
'use strict';const $=s=>document.querySelector(s),result=$('#result'),submit=$('#submit');const esc=s=>String(s??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function copy(value){navigator.clipboard?.writeText(value)}function value(label,content,copyable=false){return `<div class="field"><span class="label">${label}</span><span class="value">${esc(content)}${copyable?`<button class="copy" data-copy="${esc(content)}">复制</button>`:''}</span></div>`}function ipCard(ip){let source=ip.source||'未知';if(ip.privateOrReserved)return `<article class="card"><div class="card-head"><h2>${esc(ip.ip)}</h2><div class="card-meta"><span class="badge">私有 / 保留</span><small class="source">来源：${esc(source)}</small></div></div><p class="notice">该地址不会发送至第三方 GeoIP 服务。</p></article>`;return `<article class="card"><div class="card-head"><h2>${esc(ip.ip)}</h2><div class="card-meta"><span class="badge">IPv${ip.ipVersion|| (ip.ip?.includes(':')?6:4)}</span><small class="source">来源：${esc(source)}</small></div></div><div class="grid">${value('国家 / Country',ip.country)}${value('国家代码',ip.countryCode)}${value('省 / 州',ip.region)}${value('城市',ip.city)}${value('ISP',ip.isp,true)}${value('ASN',ip.asn,true)}${value('AS 名称',ip.asName)}${value('数据来源',ip.source)}${value('时区',ip.timezone)}</div></article>`}function records(dns){let rows=[];for(const kind of ['A','AAAA','CNAME','MX','NS','TXT']){let values=dns[kind]||[];if(kind==='MX')values=values.map(x=>`${x.priority} ${x.exchange}`);if(kind==='TXT')values=values.map(x=>x.join(''));rows.push(`<div class="record"><b>${kind}</b><span>${values.length?values.map(esc).join('<br>'):'—'}</span></div>`)}return rows.join('')}
function render(data){if(data.type==='ip'){result.innerHTML=ipCard(data.data)+`<p class="tip">${data.cached?'已使用缓存':''}${data.cached&&data.cacheAge!=null?' · '+data.cacheAge+' 秒前更新':''}</p>`;return}let d=data.data;result.innerHTML=`<article class="card"><div class="card-head"><h2>${esc(d.domain)}</h2><span class="badge">域名</span></div><div class="records">${records(d.dns)}</div></article><section><div class="card-head"><h2>解析 IP 的归属信息</h2></div>${d.ips.length?'<div class="result">'+d.ips.map(ipCard).join('')+'</div>':'<p class="notice">该域名没有可查询的公网 A 或 AAAA 记录。</p>'}${d.limited?'<p class="notice">该域名解析出较多 IP，仅展示前 8 个 IPv4 与前 8 个 IPv6 的归属信息。</p>':''}</section>`}
$('#search').addEventListener('submit',async event=>{event.preventDefault();let q=$('#q').value.trim();if(!q)return;submit.disabled=true;submit.textContent='查询中…';result.innerHTML='<p class="loading">正在解析与查询…</p>';try{let res=await fetch('/api/query?q='+encodeURIComponent(q),{headers:{accept:'application/json'}}),data=await res.json();if(!res.ok||!data.success)throw new Error(data.error||'INTERNAL_ERROR');render(data)}catch(e){let msg={INVALID_INPUT:'请输入有效的 IP、域名或 URL',DNS_NOT_FOUND:'未找到该域名的 DNS 记录。',GEO_PROVIDER_FAILED:'归属地服务暂时不可用，请稍后重试。',RATE_LIMITED:'查询过于频繁，请稍后再试。'}[e.message]||'查询失败，请稍后重试。';result.innerHTML=`<article class="card error"><h2>无法完成查询</h2><p class="notice">${msg}</p></article>`}finally{submit.disabled=false;submit.textContent='查询'}});document.addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy)});let initial=new URLSearchParams(location.search).get('q');if(initial){$('#q').value=initial;$('#search').requestSubmit()}
document.querySelector('.logo').innerHTML='<img src="/logo.png" alt="IP / 域名查询">';function initThreads(){let c=document.createElement('canvas'),x=c.getContext('2d'),w,h,dpr; c.className='threads-bg';c.setAttribute('aria-hidden','true');document.body.prepend(c);function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0)}function draw(t=0){x.clearRect(0,0,w,h);for(let i=0;i<30;i++){let p=i/29;x.beginPath();for(let px=-20;px<=w+20;px+=12){let n=px/w,y=h*.28+p*h*.42+(Math.sin(n*7.2+t*.001+p*4.6)+.46*Math.sin(n*15.5-t*.0005+p*8.1))*Math.min(h*.13,135)*.24;if(px===-20)x.moveTo(px,y);else x.lineTo(px,y)}x.strokeStyle=`rgba(31,126,235,${.015+(1-p)*.055})`;x.lineWidth=.7+(1-p)*.75;x.stroke()}if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&!document.hidden)requestAnimationFrame(draw)}addEventListener('resize',resize,{passive:true});resize();draw()}initThreads();
</script></body></html>
